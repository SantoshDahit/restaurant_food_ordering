spring:
  config:
    activate:
      on-profile: loc

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/restaurant_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Root@1234
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4taW4tcmVzdGF1cmFudC1zeXN0ZW0=

file:
  upload-dir: ./uploads
  base-url: http://localhost:8080/api/uploads

aws:
  s3:
    bucket-name: restaurantFoodOrderingSystemImagesStores
    region: ap-northeast-2
    folder-paths:
      menu-items: menu-items/

logging:
  level:
    com.restaurant.api: DEBUG
    org.hibernate.SQL: DEBUG
