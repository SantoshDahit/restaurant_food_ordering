  # ── FILES ────────────────────────────────────────────────────
  /files/upload:
    post:
      tags: [Files]
      summary: Upload an image file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (jpg, png, gif, webp — max 10MB)
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileResponse' }

  /files/{code}:
    get:
      tags: [Files]
      summary: Get file info by code (public)
      security: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileResponse' }
