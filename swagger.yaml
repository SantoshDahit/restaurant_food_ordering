      summary: Create payment (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [restaurantCode, orderCode, paymentMethod, amount]
              properties:
                restaurantCode: { type: string }
                orderCode:      { type: string }
                paymentMethod:  { $ref: '#/components/schemas/PaymentMethod' }
                amount:         { type: number }
                transactionRef: { type: string }
                receiptNumber:  { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResponse' }

  /payments/search:
    get:
      tags: [Payments]
      summary: Search payments
      parameters:
        - { name: restaurantCode, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PaymentStatus' } }
        - { name: paymentMethod, in: query, schema: { $ref: '#/components/schemas/PaymentMethod' } }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/SizeParam' }
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PageMeta' }
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/PaymentResponse' }

  /payments/{code}:
    get:
      tags: [Payments]
      summary: Get payment
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResponse' }

  /payments/{code}/status:
    patch:
      tags: [Payments]
      summary: Update payment status
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
