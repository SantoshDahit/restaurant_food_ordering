spring:
  config:
    activate:
      on-profile: common

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        default_batch_fetch_size: 1000

  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd HH:mm:ss
    mapper:
      use-annotations: true
    visibility:
      field: any

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  access-token-expiry: 3600000      # 1 hour in milliseconds
  refresh-token-expiry: 604800000   # 7 days in milliseconds

app:
  cors:
    allowed-origins:
      - "*"

security:
  whitelist:
    - /v1/auth/**
    - /v1/menu-items/**
    - /v1/menu-categories/**
    - /v1/restaurants/**
    - /v1/tables/by-token/**
    - /v1/orders/**
    - /v1/payments
    - /v1/files/**