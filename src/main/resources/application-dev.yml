spring:
  config:
    activate:
      on-profile: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://shared-mysql:3306/restaurant_booking_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET}

#file:
#  upload-dir: ${FILE_UPLOAD_DIR}
#  base-url: ${FILE_BASE_URL}

aws:
  s3:
    bucket-name: bookingsystemstorage
    region: ap-northeast-2
    folder-paths:
      menu-items: menu-items/

payment:
  esewa:
    # Defaults to the sandbox; set ESEWA_MODE=PRODUCTION (+ merchant secrets)
    # on the dev deployment to exercise the live gateway.
    mode: ${ESEWA_MODE:TEST}
    test:
      product-code: EPAYTEST
      secret-key: 8gBm/:&EnhH.1/q
      form-url: https://rc-epay.esewa.com.np/api/epay/main/v2/form
      status-url: https://rc.esewa.com.np/api/epay/transaction/status/
    production:
      product-code: ${ESEWA_PRODUCT_CODE:}
      secret-key: ${ESEWA_SECRET_KEY:}
      form-url: https://epay.esewa.com.np/api/epay/main/v2/form
      status-url: https://epay.esewa.com.np/api/epay/transaction/status/
  fonepay:
    # Per-restaurant credentials (encrypted); flip to PRODUCTION on the live deploy.
    mode: ${FONEPAY_MODE:TEST}

logging:
  level:
    com.restaurant.api: INFO
    org.hibernate.SQL: WARN
