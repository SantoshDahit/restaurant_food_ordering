spring:
  config:
    activate:
      on-profile: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET}

file:
  upload-dir: ${FILE_UPLOAD_DIR}
  base-url: ${FILE_BASE_URL}

aws:
  s3:
    bucket-name: bookingsystemstorage
    region: ap-northeast-2
    folder-paths:
      menu-items: menu-items/

logging:
  level:
    com.restaurant.api: INFO
    org.hibernate.SQL: WARN
